<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>İki Kişilik Koşu Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="info-bar">
        <h1 id="game-title">Koşu Oyunu</h1>
        <p id="room-id">Varlıklar yükleniyor...</p>
        <button id="copy-link-btn" style="display: none;">Oda Linkini Kopyala</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script src="game.js"></script>
    <script>
        const copyLinkBtn = document.getElementById('copy-link-btn');
        const roomIdDisplay = document.getElementById('room-id');

        copyLinkBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
                roomIdDisplay.textContent = 'Link Kopyalandı!';
            });
        });

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.target.textContent.includes('Oda Kodu:')) {
                    copyLinkBtn.style.display = 'inline-block';
                }
            });
        });
        observer.observe(roomIdDisplay, { childList: true, subtree: true, characterData: true });
    </script>
</body>
</html>
